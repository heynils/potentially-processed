# Builds the site from the Open Food Facts export and deploys it to Cloudflare Pages.
#
# The site is built here, not by Cloudflare: the build streams a 13 GB file
# and relies on the Actions cache, which Cloudflare's 20-minute build
# environment couldn't do. Cloudflare only receives the finished dist/ folder
# ("direct upload"). Pushes to main deploy to production; a manual run on any
# other branch deploys a preview at <branch>.<project>.pages.dev instead.
#
# The expensive part is streaming the ~13 GB export through the extract stage
# (~10 minutes). Its output, the candidate pool, is small (~125 MB), so it is
# cached and reused:
#   - schedule (weekly): always re-download, then cache the new pool
#   - push / manual run: reuse the latest cached pool; re-download only if
#     there is none, or the extract code changed, or refresh_data is ticked
# The select stage and the Astro build run every time (well under a minute).

name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC; OFF regenerates the export daily
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Re-download the Open Food Facts export
        type: boolean
        default: false

permissions:
  contents: read

# One deployment at a time; don't cancel a run that's mid-download.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  EXPORT_URL: https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz
  # Where the site lives: canonical URLs, sitemap, and the live sitemap that
  # the next build reads to keep published pages. Override with a repository
  # variable (Settings -> Secrets and variables -> Actions -> Variables).
  SITE_URL: ${{ vars.SITE_URL || 'https://ultraornot.com' }}
  CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'ultraornot' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Fail in seconds, not after a ten-minute download, if setup is missing.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README, Deployment)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests (pipeline)
        run: npm test

      # Cache key: changes when the code that decides what is extracted changes.
      - name: Compute data cache key
        id: key
        run: echo "prefix=off-pool-${{ hashFiles('pipeline/extract.ts', 'pipeline/config.ts', 'pipeline/lib/normalize.ts', 'pipeline/lib/stream.ts', 'pipeline/lib/top-k.ts', 'pipeline/lib/types.ts') }}-" >> "$GITHUB_OUTPUT"

      - name: Restore cached candidate pool
        id: restore
        if: github.event_name != 'schedule' && !inputs.refresh_data
        uses: actions/cache/restore@v6
        with:
          path: data/work
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.key.outputs.prefix }}

      - name: Download taxonomies and extract candidates from the export
        id: extract
        if: steps.restore.outputs.cache-matched-key == ''
        run: |
          mkdir -p data/work
          curl -sSfIL "$EXPORT_URL" | grep -i '^last-modified' | tail -1 | cut -d' ' -f2- | tr -d '\r' > data/work/export-date.txt
          echo "Export last modified: $(cat data/work/export-date.txt)"
          npm run data:taxonomies
          # Streams the export straight from the URL; fails on a truncated
          # download (gzip checksum) or if far fewer products than expected arrive.
          node pipeline/extract.ts --input "$EXPORT_URL" --min-lines 1000000

      - name: Save candidate pool
        if: steps.extract.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: data/work
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}

      # Pages Google has indexed should not disappear or move when the
      # weekly refresh re-ranks products. The live sitemap is the record of
      # what is published; a missing site (first deploy) just means no list.
      - name: List pages already published
        run: node pipeline/fetch-published.ts --site "$SITE_URL" --out data/published.txt

      - name: Select products and build site data
        run: node pipeline/select.ts --export-date "$(cat data/work/export-date.txt)" --published data/published.txt

      - name: Refuse to deploy sample data
        run: node -e "const m=require('./data/site/meta.json'); if (m.source !== 'export') { console.error('data/site was built from the sample'); process.exit(1) } console.log(m.funnel)"

      - name: Type-check
        run: npm run check

      - name: Build site and search index
        run: npm run build
        env:
          BASE_PATH: /
          # Set these as repository variables once AdSense is approved.
          PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          PUBLIC_AD_SLOT_PRODUCT_TOP: ${{ vars.AD_SLOT_PRODUCT_TOP }}
          PUBLIC_AD_SLOT_PRODUCT_BOTTOM: ${{ vars.AD_SLOT_PRODUCT_BOTTOM }}
          PUBLIC_AD_SLOT_CATEGORY_TOP: ${{ vars.AD_SLOT_CATEGORY_TOP }}
          PUBLIC_AD_SLOT_MARKER_TOP: ${{ vars.AD_SLOT_MARKER_TOP }}

      # Creates the Pages project on the first run; "already exists" is fine
      # and any real problem (bad token) shows up in the deploy step below.
      - name: Create Cloudflare Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.CLOUDFLARE_PROJECT }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=${{ github.ref_name }} --commit-dirty=true
